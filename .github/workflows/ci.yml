name: CI/CD Pipeline

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, xml, ctype, json, bcmath, pcntl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist
        working-directory: backend

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=pgsql/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_HOST=db//' .env
          sed -i 's/DB_PORT=5432//' .env
          sed -i 's/DB_DATABASE=project_tracker/DB_DATABASE=:memory:/' .env
          sed -i 's/DB_USERNAME=postgres//' .env
          sed -i 's/DB_PASSWORD=secret//' .env
          php artisan key:generate
        working-directory: backend

      - name: Run tests
        run: php artisan test
        working-directory: backend

  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  deploy:
    name: Deploy to GHCR
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/frontend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}/frontend:latest
